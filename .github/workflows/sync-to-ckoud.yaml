name: Sync Repository to Amazon S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run data validation
        run: python3 -m unittest discover -s tests -v

  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the private repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your S3 bucket's region

      # 3. Sync repository files to S3 Bucket
      - name: Sync to S3
        run: |
          aws s3 sync . s3://evan-public-data-827306792223-ap-southeast-1-an \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore"
